<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07111d" />
    <link rel="icon" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>Bid X — Smart Earnings</title>
    <script>
      /* apply saved theme before first paint to avoid a dark flash */
      try {
        var t = localStorage.getItem("bidx_theme");
        if (t === "light" || (!t && window.matchMedia("(prefers-color-scheme: light)").matches)) {
          document.documentElement.classList.add("light");
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body { margin: 0; padding: 0; background: #07111d; color: #eaf4fc; }
      html.light, html.light body { background: #e9f1f8; color: #142c44; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
